# Supabase CLI project configuration.
# Generated/maintained via `supabase init` / `supabase start`.
# See: https://supabase.com/docs/guides/cli/config

project_id = "fellowshipring"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
# Judges/users sign up with a username (see web/src/features/auth), which
# is turned into a synthetic, non-deliverable email under the hood — so
# there's no real inbox to confirm. Auto-confirm on signup.
enable_confirmations = false

[storage]
enabled = true

# TODO: Configure [edge_runtime] and per-function settings once
# functions are added under supabase/functions/.
